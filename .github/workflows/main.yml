name: Build PFNative

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: 1 JDK17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: 2 SDK
        run: |
          set -e
          SDK=$ANDROID_SDK_ROOT
          mkdir -p $SDK/cmdline-tools
          cd $SDK/cmdline-tools
          curl -sSLo c.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q -o c.zip
          if [ ! -d latest ]; then mv cmdline-tools latest; fi
          export PATH=$SDK/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /tmp/sdk.log 2>&1
          echo "SDK_EXIT=$?" >> $GITHUB_STEP_SUMMARY

      - name: 3 源码
        run: |
          curl -sSLo /tmp/src.zip https://aka.doubaocdn.com/s/DcdM87LsyL
          rm -rf /tmp/src
          unzip -q -o /tmp/src.zip -d /tmp/src
          mkdir -p app/src/main/java/com/promptforge/app app/src/main/cpp app/src/main/assets
          find /tmp/src -name "*.kt" -exec cp -f {} app/src/main/java/com/promptforge/app/ \;
          find /tmp/src -name "jni_bridge.cpp" -exec cp -f {} app/src/main/cpp/ \;
          find /tmp/src -name "index.html" -exec cp -f {} app/src/main/assets/ \;
          find /tmp/src -name "AndroidManifest.xml" -exec cp -f {} app/src/main/ \;
          perl -0pi -e 's/<application/<application\n        android:theme="\@style\/Theme.AppCompat.NoActionBar"/ unless /android:theme/' app/src/main/AndroidManifest.xml
          ls app/src/main/java/com/promptforge/app app/src/main/cpp app/src/main/assets >> $GITHUB_STEP_SUMMARY

      - name: 4 引擎
        run: |
          set +e
          NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973
          export PATH=$ANDROID_SDK_ROOT/cmake/3.22.1/bin:$PATH
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            https://github.com/leejet/stable-diffusion.cpp /tmp/sd > /tmp/eng.log 2>&1
          cd /tmp/sd || exit 1
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=OFF >> /tmp/eng.log 2>&1
          cmake --build build -j4 >> /tmp/eng.log 2>&1
          echo "ENGINE_EXIT=$?" >> $GITHUB_STEP_SUMMARY
          find build -name "*.a" >> $GITHUB_STEP_SUMMARY

      - name: 5 链接
        run: |
          set +e
          NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
          STRIP=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p $OUT
          $CXX -shared -fPIC -O2 -std=c++17 -static-libstdc++ -I/tmp/sd/include \
            app/src/main/cpp/jni_bridge.cpp \
            /tmp/sd/build/libstable-diffusion.a \
            /tmp/sd/build/ggml/src/libggml.a \
            /tmp/sd/build/ggml/src/libggml-cpu.a \
            /tmp/sd/build/ggml/src/libggml-base.a \
            -o $OUT/libpfengine.so -llog -landroid -lm -lz > /tmp/jni.log 2>&1
          echo "JNI_EXIT=$?" >> $GITHUB_STEP_SUMMARY
          grep -E "error|undefined reference" /tmp/jni.log | head -10 >> $GITHUB_STEP_SUMMARY
          $STRIP --strip-unneeded $OUT/libpfengine.so 2>/dev/null
          ls -lh $OUT >> $GITHUB_STEP_SUMMARY

      - name: 6 Gradle 配置
        run: |
          printf '%s\n' \
          'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
          'dependencyResolutionManagement { repositories { google(); mavenCentral() } }' \
          'rootProject.name = "PFNative"' \
          'include(":app")' > settings.gradle.kts

          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application") version "8.7.2" apply false' \
          '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false' \
          '}' > build.gradle.kts

          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application")' \
          '    id("org.jetbrains.kotlin.android")' \
          '}' \
          'android {' \
          '    namespace = "com.promptforge.app"' \
          '    compileSdk = 34' \
          '    defaultConfig {' \
          '        applicationId = "com.promptforge.app"' \
          '        minSdk = 26' \
          '        targetSdk = 34' \
          '        versionCode = 22' \
          '        versionName = "5.2"' \
          '    }' \
          '    compileOptions {' \
          '        sourceCompatibility = JavaVersion.VERSION_17' \
          '        targetCompatibility = JavaVersion.VERSION_17' \
          '    }' \
          '    kotlinOptions { jvmTarget = "17" }' \
          '}' \
          'dependencies {' \
          '    implementation("androidx.core:core-ktx:1.13.1")' \
          '    implementation("androidx.appcompat:appcompat:1.7.0")' \
          '}' > app/build.gradle.kts

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m' \
          'android.useAndroidX=true' > gradle.properties

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: 7 打包
        run: |
          set -o pipefail
          GRADLE=$(command -v gradle)
          if [ -z "$GRADLE" ]; then
            curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q -o /tmp/g.zip -d /tmp
            GRADLE=/tmp/gradle-8.10.2/bin/gradle
          fi
          "$GRADLE" :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/b.log

      - name: 8 报错摘要
        if: failure()
        run: |
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -n -A6 "What went wrong" /tmp/b.log | head -30 >> $GITHUB_STEP_SUMMARY
          grep -n -E "^e: " /tmp/b.log | head -12 >> $GITHUB_STEP_SUMMARY
          grep -n -E "CMake Error|error:" /tmp/eng.log | head -12 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 9 收集产物
        if: always()
        run: |
          mkdir -p out
          find . -name "*.apk" -not -path "./.git/*" -exec cp {} out/ \;
          ls -lh out >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-apk
          path: out/
          if-no-files-found: warn

      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          files: out/*.apk
