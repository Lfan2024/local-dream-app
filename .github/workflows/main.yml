name: Build PFNative

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - name: cache-engine
        uses: actions/cache@v4
        with:
          path: /tmp/sd/build
          key: pfsd-linux-v3
          restore-keys: |
            pfsd-linux-
      - name: build
        run: |
          curl -sSLo /tmp/b.sh https://aka.doubaocdn.com/s/TJcIMRVcCr
          bash /tmp/b.sh
      - name: report
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@local
          git checkout -B ci-report
          mkdir -p ci
          {
            echo "run=${{ github.run_number }}"
            echo "---- out ----"
            ls -l out 2>/dev/null
            echo "---- gradle ----"
            grep -n -A8 "What went wrong" /tmp/b.log 2>/dev/null | head -40
            grep -n -E "^e: |error:" /tmp/b.log 2>/dev/null | head -25
            echo "---- jni ----"
            tail -20 /tmp/jni.log 2>/dev/null
          } > ci/last.txt
          git add ci/last.txt
          git commit -m "ci report ${{ github.run_number }}" || echo nothing-to-commit
          git push -f origin ci-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-apk
          path: out/
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: Prompt Forge v5.4 (build ${{ github.run_number }})
          body: |
            Prompt Forge v5.4 · 工作台改造版

            - 词库从 2467 扩到 1.1 万+（发型/表情/服饰/动作/道具/场景/光影/天气）
            - 新增 513 个带外观的角色，点选自动补发色/瞳色/服装
            - 新增「画风库」：49 张缩略图，一键加画风标签
            - 新增一键智能负向：完整/精简/关，自动剔除冲突词
            - 界面改版：石墨 / 纸白两套新主题，去掉霓虹渐变
            - 引擎：sd.cpp 编成 libpfengine.so，本机出图
            - 图标：自适应图标（前景星形 + 渐变底）
            - 要求：Android 8.0+ / arm64-v8a
          files: out/*.apk
          fail_on_unmatched_files: true