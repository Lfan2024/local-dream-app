name: Build PFNative
permissions:
  contents: write

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: build
        run: curl -sSL "脚本地址" -o /tmp/b.sh && bash /tmp/b.sh
      - name: apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-apk
          path: out/
