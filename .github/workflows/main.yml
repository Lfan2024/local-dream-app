name: Build PFNative

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - name: build
        run: |
          curl -sSLo /tmp/b.sh https://aka.doubaocdn.com/s/YRUYbeONwp
          bash /tmp/b.sh
      - name: report
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@local
          git checkout -B ci-report
          mkdir -p ci
          {
            echo "run=${{ github.run_number }}"
            echo "---- out ----"
            ls -l out 2>/dev/null
            echo "---- gradle ----"
            grep -n -A8 "What went wrong" /tmp/b.log 2>/dev/null | head -40
            grep -n -E "^e: |error:" /tmp/b.log 2>/dev/null | head -25
            echo "---- engine ----"
            grep -n -E "CMake Error|error:" /tmp/eng.log 2>/dev/null | head -20
            echo "---- jni ----"
            tail -25 /tmp/jni.log 2>/dev/null
          } > ci/last.txt
          git add ci/last.txt
          git commit -m "ci report ${{ github.run_number }}" || echo nothing-to-commit
          git push -f origin ci-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-apk
          path: out/
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: Prompt Forge v5.2 (build ${{ github.run_number }})
          body: |
            Prompt Forge v5.2 · Android 本机出图实验版

            - 界面：Anima / MOSS-Image / Krea2 三套提示词体系，标签库 2467+
            - 云端：14 家服务商 API 可直接出图
            - 本机：模型下载可用，引擎 libpfengine.so 随包构建
            - 系统要求：Android 8.0+ / arm64-v8a
          files: out/*.apk
          fail_on_unmatched_files: true
