name: Build PFNative
permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download cmdline-tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          ls latest/bin

      - name: Install SDK packages
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls $ANDROID_SDK_ROOT/platforms

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate project
        run: |
          python3 - <<'PY'
          import os
          os.makedirs("app/src/main/java/com/demo", exist_ok=True)
          open("settings.gradle.kts","w").write('include(":app")\n')
          open("build.gradle.kts","w").write(
              'plugins {\n'
              '    id("com.android.application") version "8.7.2" apply false\n'
              '}\n'
          )
          open("app/build.gradle.kts","w").write(
              'plugins {\n'
              '    id("com.android.application")\n'
              '}\n'
              'android {\n'
              '    namespace = "com.demo"\n'
              '    compileSdk = 34\n'
              '    defaultConfig {\n'
              '        minSdk = 24\n'
              '        targetSdk = 34\n'
              '        versionCode = 1\n'
              '        versionName = "1.0"\n'
              '    }\n'
              '}\n'
          )
          open("local.properties","w").write("sdk.dir=" + os.environ["ANDROID_SDK_ROOT"] + "\n")
          PY

      - name: Build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
