name: Build PFNative

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - name: cache-engine
        uses: actions/cache@v4
        with:
          path: /tmp/sd/build
          key: pfsd-linux-v3
          restore-keys: |
            pfsd-linux-
      - name: build
        run: |
          curl -sSLo /tmp/b.sh https://aka.doubaocdn.com/s/cuktNEQiOl
          bash /tmp/b.sh
      - name: report
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@local
          git checkout -B ci-report
          mkdir -p ci
          {
            echo "run=${{ github.run_number }}"
            echo "---- out ----"
            ls -l out 2>/dev/null
            echo "---- gradle ----"
            grep -n -A8 "What went wrong" /tmp/b.log 2>/dev/null | head -40
            grep -n -E "^e: |error:" /tmp/b.log 2>/dev/null | head -25
            echo "---- jni ----"
            tail -20 /tmp/jni.log 2>/dev/null
          } > ci/last.txt
          git add ci/last.txt
          git commit -m "ci report ${{ github.run_number }}" || echo nothing-to-commit
          git push -f origin ci-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-apk
          path: out/
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v5.8-build-${{ github.run_number }}
          name: Prompt Forge v5.8（构建 ${{ github.run_number }}）
          body: |
            Prompt Forge v5.8 · 模型库与设置页重组版

            - 设置页合并为「常规」页：主题、负向、18+、语法、数据备份集中在一处
            - 修复「界面主题」标题被挤成竖排、18+/NSFW 行文字过窄的布局问题
            - 18+ / NSFW 默认不勾选（首次启动自动隐藏）
            - 模型库扩到 26 个模型，新增搜索与筛选（全部 / 能本机跑 / SD1.5 / SDXL）
            - 下载支持暂停 / 继续 / 删除，进度条显示实时速度
            - 下载源可选「国内镜像 hf-mirror.com」或「国外直连 huggingface.co」
            - 新增本地离线 AI 扩写：一句中文描述扩展成完整正向标签流
            - 导出改存到 App 私有目录并回显路径，导入支持粘贴 JSON（不再依赖文件管理器）
            - 要求：Android 8.0+ / arm64-v8a
          files: out/*.apk
          fail_on_unmatched_files: true
