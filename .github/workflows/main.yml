name: Build PFNative
permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate project
        run: |
          python3 - <<'PY'
          import os
          os.makedirs("app/src/main/java/com/demo", exist_ok=True)
          open("settings.gradle.kts","w").write('include(":app")\n')
          open("build.gradle.kts","w").write(
            'plugins {\n'
            '    id("com.android.application") version "8.7.2" apply false\n'
            '}\n'
          )
          open("app/build.gradle.kts","w").write(
            'plugins {\n'
            '    id("com.android.application")\n'
            '}\n'
            'android {\n'
            '    namespace = "com.demo"\n'
            '    compileSdk = 34\n'
            '    defaultConfig {\n'
            '        minSdk = 24\n'
            '        targetSdk = 34\n'
            '        versionCode = 1\n'
            '        versionName = "1.0"\n'
            '    }\n'
            '}\n'
          )
          PY

      - name: List files
        run: ls -la

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
