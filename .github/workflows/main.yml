name: Build PFNative
permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download cmdline-tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest

      - name: Install SDK packages
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: 覆盖真源码
        run: |
          rm -rf app/src/main/java/com/promptforge/app
          mkdir -p app/src/main
          curl -sSLo /tmp/pk.zip https://aka.doubaocdn.com/s/DcdM87LsyL
          unzip -q -o /tmp/pk.zip -d /tmp/pk
          cp -r /tmp/pk/main/* app/src/main/
          cp -r /tmp/pk/cpp app/src/main/
          cp -r /tmp/pk/assets app/src/main/
          cp /tmp/pk/AndroidManifest.xml app/src/main/
          ls -R app/src/main | head -30 >> $GITHUB_STEP_SUMMARY

      - name: 编译引擎
        run: |
          set +e
          NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973
          : > /tmp/eng.log
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            https://github.com/leejet/stable-diffusion.cpp /tmp/sd >> /tmp/eng.log 2>&1
          echo "CLONE_EXIT=$?" >> /tmp/eng.log
          cd /tmp/sd || true
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=OFF >> /tmp/eng.log 2>&1
          echo "CMAKE_EXIT=$?" >> /tmp/eng.log
          cmake --build build -j4 >> /tmp/eng.log 2>&1
          echo "BUILD_EXIT=$?" >> /tmp/eng.log
          echo '#### 引擎日志' >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "CLONE_EXIT=|CMAKE_EXIT=|BUILD_EXIT=" /tmp/eng.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 链 JNI
        run: |
          set +e
          NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
          STRIP=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p $OUT
          $CXX -shared -fPIC -O2 -std=c++17 -static-libstdc++ \
            -I/tmp/sd/include \
            app/src/main/cpp/jni_bridge.cpp \
            /tmp/sd/build/libstable-diffusion.a \
            /tmp/sd/build/ggml/src/libggml.a \
            /tmp/sd/build/ggml/src/libggml-cpu.a \
            /tmp/sd/build/ggml/src/libggml-base.a \
            -o $OUT/libpfengine.so -llog -landroid -lm -lz > /tmp/jni.log 2>&1
          echo "JNI_EXIT=$?" >> $GITHUB_STEP_SUMMARY
          grep -E "error|undefined" /tmp/jni.log | head -10 >> $GITHUB_STEP_SUMMARY || true
          $STRIP --strip-unneeded $OUT/libpfengine.so || true
          ls -lh $OUT >> $GITHUB_STEP_SUMMARY

      - name: 写 Gradle 配置
        run: |
          python3 - <<'PY'
          import os
          open("settings.gradle.kts","w").write('include(":app")\n')
          open("build.gradle.kts","w").write(
              'plugins {\n'
              '    id("com.android.application") version "8.7.2" apply false\n'
              '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n'
              '}\n'
          )
          open("app/build.gradle.kts","w").write(
              'plugins {\n'
              '    id("com.android.application")\n'
              '    id("org.jetbrains.kotlin.android")\n'
              '}\n'
              'android {\n'
              '    namespace = "com.promptforge.app"\n'
              '    compileSdk = 34\n'
              '    defaultConfig {\n'
              '        applicationId = "com.promptforge.app"\n'
              '        minSdk = 26\n'
              '        targetSdk = 34\n'
              '        versionCode = 20\n'
              '        versionName = "5.0"\n'
              '    }\n'
              '    compileOptions {\n'
              '        sourceCompatibility = JavaVersion.VERSION_17\n'
              '        targetCompatibility = JavaVersion.VERSION_17\n'
              '    }\n'
              '    kotlinOptions { jvmTarget = "17" }\n'
              '}\n'
              'dependencies {\n'
              '    implementation("androidx.core:core-ktx:1.13.1")\n'
              '    implementation("androidx.appcompat:appcompat:1.7.0")\n'
              '}\n'
          )
          open("local.properties","w").write("sdk.dir=" + os.environ["ANDROID_SDK_ROOT"] + "\n")
          PY
          cat app/build.gradle.kts >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: |
          set -o pipefail
          GRADLE=$(command -v gradle || true)
          if [ -z "$GRADLE" ]; then
            curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q /tmp/g.zip -d /tmp
            GRADLE=/tmp/gradle-8.10.2/bin/gradle
          fi
          echo "GRADLE=$GRADLE" >> $GITHUB_STEP_SUMMARY
          $GRADLE :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/b.log

      - name: 抓错误
        if: failure()
        run: |
          echo '#### 构建错误' >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -n -A6 "What went wrong" /tmp/b.log | head -40 >> $GITHUB_STEP_SUMMARY || true
          grep -n -E "^e: |error:" /tmp/b.log | head -15 | cut -c1-160 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 收集APK
        if: always()
        run: |
          mkdir -p out
          find . -name "*.apk" -not -path "./.git/*" -exec cp {} out/ \;
          ls -lh out >> $GITHUB_STEP_SUMMARY || true

      - name: 上传APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-apk
          path: out/
          if-no-files-found: warn

      - name: 发布APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: out/*.apk
