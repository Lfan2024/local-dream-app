name: Build PFNative
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: 手动安装 Android SDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11479570_latest.zip
          unzip -q commandlinetools-linux-11479570_latest.zip
          mv cmdline-tools latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: 生成基础工程
        run: |
          mkdir -p app/src/main/java/com/demo
          echo 'include(":app")' > settings.gradle.kts
          cat > build.gradle.kts <<'EOF'
plugins {
    id("com.android.application") version "8.7.2" apply false
}
EOF
          cat > app/build.gradle.kts <<'EOF'
plugins {
    id("com.android.application")
}
android {
    namespace = "com.demo"
    compileSdk = 34
    defaultConfig {
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }
}
EOF
          apt update && apt install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          ./gradle-8.10/bin/gradle wrapper
          chmod +x gradlew

      - name: 列出文件
        run: ls -la

      - name: 构建
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
